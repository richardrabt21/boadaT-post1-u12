spring.datasource.url=${DATASOURCE_URL:jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATASOURCE_USER:sa}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
logging.level.com.tienda=DEBUG

app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-no-usar-en-produccion}

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
